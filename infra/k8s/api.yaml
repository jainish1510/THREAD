apiVersion: apps/v1
kind: Deployment
metadata:
  name: thread-api
  namespace: thread
  labels: { app: thread-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: thread-api } }
  template:
    metadata:
      labels: { app: thread-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: ghcr.io/jainish1510/thread-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: thread-config }
            - secretRef: { name: thread-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 15
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: thread-api
  namespace: thread
spec:
  selector: { app: thread-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thread-api
  namespace: thread
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: thread-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
