apiVersion: v1
kind: ConfigMap
metadata:
  name: thread-config
  namespace: thread
data:
  ENVIRONMENT: production
  CORS_ORIGINS: https://thread.example.com
  PUBLIC_WEB_URL: https://thread.example.com
  COOKIE_SECURE: "true"
  SEED_DEMO_HISTORY: "true"
  API_INTERNAL_URL: http://thread-api:8000
---
# Example only — create the real secret out of band (e.g. External Secrets / SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: thread-secrets
  namespace: thread
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://thread:CHANGE_ME@postgres:5432/thread
  REDIS_URL: redis://redis:6379/0
  ADMIN_PASSWORD: CHANGE_ME
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
